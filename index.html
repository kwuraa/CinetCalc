<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <title>CinetCalc</title>
</head>
<body>
        <div class="app-layout">
        
        
        <div class="glass-calculator-card">
            <div class="card-header">
            <span class="badge">Física Industrial</span>
            <h2>Calculadora de <span>Energia Cinética</span></h2>
            <p>Calcule o impacto operacional em Joules</p>
            </div>

            <form class="calculator-form" onsubmit="event.preventDefault();">
            <div class="input-group">
                <label for="mass">Massa do Objeto (kg)</label>
                <input type="number" id="mass" placeholder="Ex: 500" step="any" value="500" required />
            </div>

            <div class="input-group">
                <label for="velocity">Velocidade (m/s)</label>
                <input type="number" id="velocity" placeholder="Ex: 12" step="any" value="12" required />
            </div>

            <div class="result-glass-box">
                <span class="result-label">Energia Cinética Resultante</span>
                <div class="result-value">36.000,00 <span class="unit">J</span></div>
            </div>

            <button type="submit" class="btn-primary">Calcular Impacto</button>
            </form>
        </div>

        <div class="glass-calculator-card chart-card">
            <div class="card-header">
            <span class="badge">Comportamento da Curva</span>
            <h3>Impacto da <span>Velocidade</span></h3>
            <p>Curva de variação da energia em relação ao aumento de velocidade.</p>
            </div>
            
            <div class="chart-container">
            <canvas id="kineticChart"></canvas>
            </div>
        </div>

        </div>
    <script src="script.js"></script>
</body>
</html>
